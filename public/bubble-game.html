<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>업무 러시</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: #0F172A;
  font-family: -apple-system, 'Helvetica Neue', 'Apple SD Gothic Neo', sans-serif;
  user-select: none;
  overflow: hidden;
  height: 100vh;
}

/* ── HUD ─────────────────────────────────────── */
#hud {
  position: fixed; top:0; left:0; right:0; height:60px;
  background: rgba(15,23,42,0.95);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(255,255,255,0.07);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; z-index: 100;
}
#hud-score { font-size:22px; font-weight:800; color:#fff; letter-spacing:-0.5px; }
#hud-score span { font-size:13px; font-weight:400; color:rgba(255,255,255,0.4); margin-right:4px; }
#hud-timer {
  display:flex; align-items:center; gap:10px;
}
#hud-timer-bar-wrap {
  width:160px; height:8px; background:rgba(255,255,255,0.1); border-radius:99px; overflow:hidden;
}
#hud-timer-bar { height:100%; background:#4C7FE0; border-radius:99px; transition:background 0.3s; }
#hud-timer-text { font-size:20px; font-weight:800; color:#fff; width:32px; text-align:right; }
#hud-combo {
  font-size:14px; font-weight:700; color:#F59E0B;
  opacity:0; transition:opacity 0.2s;
  text-shadow: 0 0 12px #F59E0B80;
}
#hud-combo.show { opacity:1; }
#hud-miss { font-size:13px; color:rgba(255,255,255,0.35); }

/* ── 게임 영역 ──────────────────────────────── */
#game-area {
  position: fixed; top:60px; left:0; right:0; bottom:0;
  overflow:hidden;
}

/* ── 업무 카드 ──────────────────────────────── */
.task-card {
  position: absolute;
  background: #fff;
  border-radius: 14px;
  padding: 10px 14px 8px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.25), 0 1px 4px rgba(0,0,0,0.1);
  cursor: pointer;
  min-width: 138px;
  max-width: 170px;
  transform-origin: center center;
  animation: popIn 0.22s cubic-bezier(0.34,1.56,0.64,1) forwards;
  border: 1.5px solid rgba(0,0,0,0.06);
  transition: box-shadow 0.15s, transform 0.1s;
}
.task-card:hover { box-shadow: 0 8px 32px rgba(0,0,0,0.35); transform:scale(1.04); }
.task-card:active { transform:scale(0.97); }

.task-card.completing {
  animation: complete 0.25s cubic-bezier(0.55,0,1,0.45) forwards;
  pointer-events: none;
}
.task-card.expiring {
  animation: expire 0.35s ease forwards;
  pointer-events: none;
}

.task-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.3px;
  padding: 2px 7px; border-radius: 99px; margin-bottom: 6px;
}
.task-name {
  font-size: 13px; font-weight: 600; color: #1E293B; line-height: 1.3;
  margin-bottom: 8px;
}
.task-timer-bar-wrap {
  height: 4px; background: rgba(0,0,0,0.08); border-radius: 99px; overflow:hidden;
}
.task-timer-bar {
  height: 100%; border-radius: 99px; transition: background 0.5s;
}

/* ── 점수 팝업 ──────────────────────────────── */
.score-pop {
  position: absolute;
  font-size: 15px; font-weight: 800;
  pointer-events: none;
  animation: scorePop 0.7s ease forwards;
  white-space: nowrap;
  text-shadow: 0 2px 6px rgba(0,0,0,0.4);
}

/* ── 애니메이션 ─────────────────────────────── */
@keyframes popIn {
  from { transform:scale(0.3); opacity:0; }
  to   { transform:scale(1);   opacity:1; }
}
@keyframes complete {
  0%   { transform:scale(1);    opacity:1; }
  40%  { transform:scale(1.18); opacity:1; }
  100% { transform:scale(0);    opacity:0; }
}
@keyframes expire {
  0%,100% { transform:translateX(0)  scale(1);    opacity:1; }
  20%     { transform:translateX(-9px) scale(0.97); }
  40%     { transform:translateX(9px)  scale(0.97); }
  60%     { transform:translateX(-6px); }
  80%     { transform:translateX(6px)  opacity:0.3; }
  100%    { opacity:0; }
}
@keyframes scorePop {
  0%   { transform:translateY(0)   scale(1);    opacity:1; }
  60%  { transform:translateY(-36px) scale(1.1); opacity:1; }
  100% { transform:translateY(-60px) scale(0.9); opacity:0; }
}
@keyframes comboShake {
  0%,100% { transform:scale(1); }
  50%     { transform:scale(1.2); }
}

/* ── 화면 오버레이 ──────────────────────────── */
.screen {
  position:fixed; inset:0; z-index:200;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:16px;
  background:rgba(10,15,28,0.94);
  backdrop-filter:blur(12px);
}
.screen.hidden { display:none; }

.screen .icon { font-size:56px; line-height:1; }
.screen h1 {
  font-size:28px; font-weight:800; color:#fff; letter-spacing:-0.8px;
}
.screen .desc {
  font-size:14px; color:rgba(255,255,255,0.45); text-align:center;
  line-height:1.7; white-space:pre-line; max-width:380px;
}
.btn {
  background:#4C7FE0; color:#fff; border:none;
  padding:12px 32px; border-radius:12px;
  font-size:15px; font-weight:700; cursor:pointer;
  font-family:inherit; transition:background 0.15s, transform 0.1s;
  letter-spacing:-0.2px;
}
.btn:hover { background:#3A6CC8; }
.btn:active { transform:scale(0.97); }
.btn.secondary {
  background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.7);
}
.btn.secondary:hover { background:rgba(255,255,255,0.14); }

/* 입력 */
.name-input {
  background:rgba(255,255,255,0.08); border:1.5px solid rgba(255,255,255,0.15);
  color:#fff; font-size:18px; font-weight:700; font-family:inherit;
  padding:10px 20px; border-radius:12px; text-align:center; width:220px;
  outline:none; letter-spacing:-0.3px;
}
.name-input::placeholder { color:rgba(255,255,255,0.25); font-weight:400; }
.name-input:focus { border-color:rgba(76,127,224,0.6); background:rgba(76,127,224,0.1); }

/* 리더보드 */
#leaderboard {
  width:320px; max-height:260px; overflow-y:auto;
  display:flex; flex-direction:column; gap:6px;
}
.lb-row {
  display:flex; align-items:center; gap:10px;
  background:rgba(255,255,255,0.06); border-radius:10px;
  padding:9px 14px;
}
.lb-rank { font-size:15px; width:22px; text-align:center; }
.lb-name { flex:1; font-size:14px; font-weight:600; color:#fff; }
.lb-score { font-size:14px; font-weight:800; color:#4C7FE0; }
.lb-new { font-size:10px; font-weight:700; color:#F59E0B; margin-left:4px; }

/* 인트로 가이드 */
.guide {
  display:flex; gap:16px; margin-top:4px;
}
.guide-item {
  display:flex; align-items:center; gap:8px;
  background:rgba(255,255,255,0.05); border-radius:12px; padding:10px 14px;
}
.guide-badge {
  font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px;
}
.guide-info { font-size:12px; color:rgba(255,255,255,0.5); line-height:1.5; }
.guide-info b { color:rgba(255,255,255,0.85); display:block; font-size:13px; }
</style>
</head>
<body>

<!-- HUD -->
<div id="hud">
  <div id="hud-score"><span>점수</span><span id="score-display">0</span></div>
  <div id="hud-timer">
    <div id="hud-timer-bar-wrap"><div id="hud-timer-bar"></div></div>
    <div id="hud-timer-text">40</div>
  </div>
  <div style="display:flex;align-items:center;gap:16px;">
    <div id="hud-combo">⚡ COMBO x<span id="combo-count">1</span></div>
    <div id="hud-miss">놓침 <span id="miss-display">0</span></div>
  </div>
</div>

<!-- 게임 영역 -->
<div id="game-area"></div>

<!-- 시작 화면 -->
<div class="screen" id="start-screen">
  <div class="icon">⚡</div>
  <h1>업무 러시</h1>
  <p class="desc">터지는 업무 카드를 빠르게 클릭해서 처리하세요!\n긴급 업무일수록 빨리 클릭해야 높은 점수!</p>
  <div class="guide">
    <div class="guide-item">
      <span class="guide-badge" style="background:#FEE2E2;color:#EF4444">긴급</span>
      <div class="guide-info"><b>+20pt</b>빠르게 사라짐</div>
    </div>
    <div class="guide-item">
      <span class="guide-badge" style="background:#DBEAFE;color:#3B82F6">보통</span>
      <div class="guide-info"><b>+12pt</b>적당한 여유</div>
    </div>
    <div class="guide-item">
      <span class="guide-badge" style="background:#D1FAE5;color:#059669">여유</span>
      <div class="guide-info"><b>+7pt</b>천천히 가능</div>
    </div>
  </div>
  <input class="name-input" id="name-input" placeholder="이름을 입력하세요" maxlength="8" />
  <button class="btn" id="start-btn">시작!</button>
</div>

<!-- 종료 화면 -->
<div class="screen hidden" id="end-screen">
  <div class="icon" id="end-icon">🏆</div>
  <h1 id="end-title"></h1>
  <div style="font-size:48px;font-weight:900;color:#4C7FE0;letter-spacing:-2px;" id="end-score"></div>
  <p class="desc" id="end-msg"></p>
  <div id="leaderboard"></div>
  <div style="display:flex;gap:10px;margin-top:4px">
    <button class="btn" id="retry-btn">다시 도전</button>
    <button class="btn secondary" id="change-btn">이름 변경</button>
  </div>
</div>

<script>
// ── 상수 ──────────────────────────────────────────────────────────────
const TOTAL_TIME = 40
const CARD_MARGIN = 12
const CARD_W = 155, CARD_H = 78

const TASK_TYPES = [
  {
    type: '긴급', emoji: '🔴',
    color: '#EF4444', bg: '#FEF2F2', barColor: '#EF4444',
    life: 2600, basePoints: 20,
    list: ['긴급 회의!','즉시 보고!','고객 컴플레인!','서버 다운!','마감 D-0!','CEO 호출!','승인 지연!'],
  },
  {
    type: '보통', emoji: '🔵',
    color: '#3B82F6', bg: '#EFF6FF', barColor: '#3B82F6',
    life: 4400, basePoints: 12,
    list: ['보고서 작성','팀 미팅 준비','코드 리뷰','이메일 회신','업무 일지','주간 보고','제안서 검토'],
  },
  {
    type: '여유', emoji: '🟢',
    color: '#059669', bg: '#F0FDF4', barColor: '#10B981',
    life: 7000, basePoints: 7,
    list: ['팀 점심 예약','자료 정리','명함 정리','교육 수강','사무용품 주문','독서','환경 정리'],
  },
]

// ── 상태 ──────────────────────────────────────────────────────────────
let playerName = ''
let score = 0, missCount = 0
let combo = 0, comboTimer = null
let timeLeft = TOTAL_TIME
let playing = false
let spawnInterval = null, timerInterval = null
let cards = []   // { el, type, timerId, startTime }
let spawnRate = 1600  // ms — 점점 빨라짐

// ── 시작 ──────────────────────────────────────────────────────────────
function startGame() {
  playerName = document.getElementById('name-input').value.trim() || '익명'

  document.getElementById('start-screen').classList.add('hidden')
  document.getElementById('end-screen').classList.add('hidden')
  document.getElementById('game-area').innerHTML = ''

  score = 0; missCount = 0; combo = 0; timeLeft = TOTAL_TIME
  spawnRate = 1600; cards = []
  playing = true

  updateHUD()
  document.getElementById('hud-timer-bar').style.background = '#4C7FE0'

  // 스폰 루프 (점점 빨라짐)
  scheduleSpawn()

  // 타이머
  timerInterval = setInterval(() => {
    timeLeft--
    updateHUD()
    // 가속
    if (timeLeft === 30) spawnRate = 1300
    if (timeLeft === 20) spawnRate = 1000
    if (timeLeft === 10) spawnRate = 750
    if (timeLeft <= 0) endGame()
  }, 1000)
}

function scheduleSpawn() {
  if (!playing) return
  spawnCard()
  spawnInterval = setTimeout(scheduleSpawn, spawnRate + (Math.random() - 0.5) * 400)
}

// ── 카드 스폰 ─────────────────────────────────────────────────────────
function spawnCard() {
  if (!playing || cards.length >= 10) return

  const area  = document.getElementById('game-area')
  const aW    = area.clientWidth
  const aH    = area.clientHeight

  // 타입 가중치: 긴급 20%, 보통 50%, 여유 30%
  const rand = Math.random()
  const type = rand < 0.2 ? TASK_TYPES[0] : rand < 0.7 ? TASK_TYPES[1] : TASK_TYPES[2]
  const taskName = type.list[Math.floor(Math.random() * type.list.length)]

  // 위치 (겹침 최소화)
  let x, y, tries = 0
  do {
    x = CARD_MARGIN + Math.random() * (aW - CARD_W - CARD_MARGIN * 2)
    y = CARD_MARGIN + Math.random() * (aH - CARD_H - CARD_MARGIN * 2)
    tries++
  } while (tries < 12 && cards.some(c => {
    const r = c.el.getBoundingClientRect()
    const cx = r.left - area.getBoundingClientRect().left
    const cy = r.top  - area.getBoundingClientRect().top
    return Math.abs(cx - x) < CARD_W + 8 && Math.abs(cy - y) < CARD_H + 8
  }))

  const el = document.createElement('div')
  el.className = 'task-card'
  el.style.left = x + 'px'
  el.style.top  = y + 'px'

  el.innerHTML = `
    <div class="task-badge" style="background:${type.bg};color:${type.color}">
      ${type.emoji} ${type.type}
    </div>
    <div class="task-name">${taskName}</div>
    <div class="task-timer-bar-wrap">
      <div class="task-timer-bar" style="width:100%;background:${type.barColor}"></div>
    </div>
  `

  const startTime = Date.now()
  const bar = el.querySelector('.task-timer-bar')

  // 타이머 바 업데이트
  const barInterval = setInterval(() => {
    const elapsed = Date.now() - startTime
    const pct = Math.max(0, 1 - elapsed / type.life)
    bar.style.width = (pct * 100) + '%'
    if (pct < 0.3) bar.style.background = '#EF4444'
    else if (pct < 0.6) bar.style.background = '#F59E0B'
    else bar.style.background = type.barColor
  }, 50)

  // 만료 타이머
  const expireTimer = setTimeout(() => {
    if (!el.parentNode) return
    clearInterval(barInterval)
    el.classList.add('expiring')
    missCount++
    score = Math.max(0, score - 5)
    cards = cards.filter(c => c.el !== el)
    showScorePop(x + CARD_W/2, y, '-5', '#EF4444')
    updateHUD()
    combo = 0
    updateCombo()
    setTimeout(() => el.remove(), 400)
  }, type.life)

  // 클릭 처리
  el.addEventListener('click', () => {
    if (!playing) return
    clearTimeout(expireTimer)
    clearInterval(barInterval)
    el.classList.add('completing')
    cards = cards.filter(c => c.el !== el)

    // 점수 계산 (남은 시간 기준 보너스)
    const elapsed = Date.now() - startTime
    const ratio   = Math.max(0, 1 - elapsed / type.life)
    const pts     = Math.round(type.basePoints + type.basePoints * ratio * 0.8)

    // 콤보
    combo++
    clearTimeout(comboTimer)
    comboTimer = setTimeout(() => { combo = 0; updateCombo() }, 1400)
    const comboMulti = Math.min(1 + (combo - 1) * 0.15, 2.5)
    const finalPts = Math.round(pts * comboMulti)

    score += finalPts
    updateHUD()
    updateCombo()

    const popColor = type.color
    const popText  = combo >= 3 ? `+${finalPts} x${combo}!` : `+${finalPts}`
    showScorePop(x + CARD_W/2, y + CARD_H/2, popText, popColor)

    setTimeout(() => el.remove(), 260)
  })

  area.appendChild(el)
  cards.push({ el, type, startTime })
}

// ── 스코어 팝업 ───────────────────────────────────────────────────────
function showScorePop(x, y, text, color) {
  const area = document.getElementById('game-area')
  const el = document.createElement('div')
  el.className = 'score-pop'
  el.textContent = text
  el.style.left  = x + 'px'
  el.style.top   = y + 'px'
  el.style.color = color
  area.appendChild(el)
  setTimeout(() => el.remove(), 720)
}

// ── HUD 업데이트 ──────────────────────────────────────────────────────
function updateHUD() {
  document.getElementById('score-display').textContent = score.toLocaleString()
  document.getElementById('miss-display').textContent  = missCount
  document.getElementById('hud-timer-text').textContent = timeLeft

  const pct = timeLeft / TOTAL_TIME
  const bar = document.getElementById('hud-timer-bar')
  bar.style.width = (pct * 100) + '%'
  bar.style.background = pct < 0.25 ? '#EF4444' : pct < 0.5 ? '#F59E0B' : '#4C7FE0'
}

function updateCombo() {
  const el = document.getElementById('hud-combo')
  document.getElementById('combo-count').textContent = combo
  if (combo >= 2) {
    el.classList.add('show')
    el.style.animation = 'none'
    void el.offsetWidth
    el.style.animation = ''
  } else {
    el.classList.remove('show')
  }
}

// ── 종료 ──────────────────────────────────────────────────────────────
function endGame() {
  playing = false
  clearTimeout(spawnInterval)
  clearInterval(timerInterval)
  document.getElementById('game-area').innerHTML = ''

  // 결과 메시지
  let icon, title, msg
  const total = score
  if      (total < 150)  { icon='😵'; title='업무에 치였어요';   msg='다음엔 긴급 업무부터\n빠르게 처리해보세요!' }
  else if (total < 350)  { icon='💪'; title='성실한 직원';       msg='꾸준히 처리했어요!\n콤보를 노리면 점수가 뛰어오릅니다.' }
  else if (total < 600)  { icon='⚡'; title='업무 처리 능력자';  msg='빠른 판단력! 긴급 업무를\n먼저 처리하는 습관이 보여요.' }
  else                   { icon='🚀'; title='업무 마스터!';      msg='완벽한 우선순위 판단!\n팀의 에이스가 여기 있었군요 👑' }

  document.getElementById('end-icon').textContent  = icon
  document.getElementById('end-title').textContent = title
  document.getElementById('end-score').textContent = total.toLocaleString() + 'pt'
  document.getElementById('end-msg').textContent   = msg

  // 리더보드 저장
  const isNew = saveScore(playerName, total)
  renderLeaderboard(isNew ? playerName : null)

  document.getElementById('end-screen').classList.remove('hidden')
}

// ── 리더보드 (localStorage) ───────────────────────────────────────────
const LB_KEY = 'hrm_tashrush_lb'

function saveScore(name, pts) {
  const lb   = getScores()
  const prev = lb.find(r => r.name === name)
  if (prev) {
    if (pts > prev.score) { prev.score = pts; saveLb(lb); return true }
    return false
  }
  lb.push({ name, score: pts })
  saveLb(lb)
  return true
}

function getScores() {
  try { return JSON.parse(localStorage.getItem(LB_KEY) || '[]') } catch { return [] }
}
function saveLb(lb) {
  lb.sort((a, b) => b.score - a.score)
  localStorage.setItem(LB_KEY, JSON.stringify(lb.slice(0, 12)))
}

function renderLeaderboard(newName) {
  const lb  = getScores()
  const el  = document.getElementById('leaderboard')
  el.innerHTML = ''

  if (!lb.length) return

  const label = document.createElement('div')
  label.style.cssText = 'font-size:11px;color:rgba(255,255,255,0.3);text-align:center;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:2px'
  label.textContent = '🏆 팀 리더보드'
  el.appendChild(label)

  const medals = ['🥇','🥈','🥉']
  lb.slice(0, 8).forEach((r, i) => {
    const row = document.createElement('div')
    row.className = 'lb-row'
    const isNew = r.name === newName
    if (isNew) row.style.background = 'rgba(76,127,224,0.18)'

    row.innerHTML = `
      <span class="lb-rank">${medals[i] ?? (i+1)}</span>
      <span class="lb-name">${r.name}${isNew ? '<span class="lb-new">NEW</span>' : ''}</span>
      <span class="lb-score">${r.score.toLocaleString()}pt</span>
    `
    el.appendChild(row)
  })
}

// ── 이벤트 ────────────────────────────────────────────────────────────
document.getElementById('start-btn').addEventListener('click', startGame)
document.getElementById('retry-btn').addEventListener('click', () => {
  document.getElementById('end-screen').classList.add('hidden')
  startGame()
})
document.getElementById('change-btn').addEventListener('click', () => {
  document.getElementById('end-screen').classList.add('hidden')
  document.getElementById('start-screen').classList.remove('hidden')
})
document.getElementById('name-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') startGame()
})

// 초기 리더보드 표시
renderLeaderboard(null)
</script>
